name: Exact combinatorics
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate exact counts and negative controls
        run: python -m unittest discover -s tests -v
      - name: Execute deterministic enumeration
        run: python -m arborescent_tangles.counts --max-k 10 --alphabet-size 3
